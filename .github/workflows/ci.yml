name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: 29.0.2
          elixir-version: 1.20.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Includes the Fly release smoke and three-node Caddy mesh reroute probe.
      - name: Tests, releases, adapters and cross-node WebSockets
        run: scripts/ci.sh
